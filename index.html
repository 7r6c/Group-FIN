<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="لوحة إدارة مالية وحضور بالعربية: خزينة المجموعة، رسوم الجلسات، الأعضاء، المصروفات، والتصدير إلى Excel.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Cpath d='M16 7l8 4v10l-8 4-8-4V11z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M8 11l8 4 8-4M16 15v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>الخزينة | لوحة الإدارة المالية والحضور</title>
<style>
/* ============ Design tokens ============ */
:root{
  --bg:#f2f5f8;
  --bg-grad:radial-gradient(1200px 600px at 100% -10%, #d9f6ef 0%, transparent 60%),
            radial-gradient(900px 500px at 0% 0%, #e3ecff 0%, transparent 55%);
  --surface:#ffffff;
  --surface-2:#f6f8fb;
  --surface-3:#eef2f7;
  --border:#e2e8f0;
  --border-strong:#cbd5e1;
  --text:#0d1b2a;
  --muted:#64748b;
  --muted-2:#94a3b8;
  --primary:#0f766e;
  --primary-soft:#ccfbf1;
  --primary-ink:#0b4f4a;
  --accent:#2563eb;
  --ok:#15803d;
  --ok-soft:#dcfce7;
  --warn:#b45309;
  --warn-soft:#fef3c7;
  --bad:#b91c1c;
  --bad-soft:#fee2e2;
  --info:#0369a1;
  --info-soft:#e0f2fe;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(13,27,42,.04), 0 10px 30px -18px rgba(13,27,42,.25);
  --shadow-lg:0 24px 60px -24px rgba(13,27,42,.35);
  --sidebar-w:268px;
  --font:"Noto Kufi Arabic","Cairo","Dubai","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#080e18;
  --bg-grad:radial-gradient(1200px 600px at 100% -10%, #0d3b36 0%, transparent 60%),
            radial-gradient(900px 500px at 0% 0%, #101d33 0%, transparent 55%);
  --surface:#0f1729;
  --surface-2:#131e33;
  --surface-3:#1a2740;
  --border:#22304a;
  --border-strong:#33445f;
  --text:#e9eefa;
  --muted:#9aabc4;
  --muted-2:#7c8da6;
  --primary:#2dd4bf;
  --primary-soft:#10322f;
  --primary-ink:#a7f3e6;
  --accent:#60a5fa;
  --ok:#4ade80;
  --ok-soft:#0f2a1c;
  --warn:#fbbf24;
  --warn-soft:#33230a;
  --bad:#f87171;
  --bad-soft:#331414;
  --info:#7dd3fc;
  --info-soft:#0d2537;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -24px rgba(0,0,0,.8);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.cur{font-size:.72em;color:var(--muted);font-weight:500}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
svg{width:20px;height:20px;flex:0 0 auto}

/* ============ Layout ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
@media (max-width:1024px){ :root{--sidebar-w:0px} .app{grid-template-columns:minmax(0,1fr)} }

/* ============ Sidebar ============ */
.sidebar{
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:18px;
  padding:20px 16px;
  background:var(--surface);
  border-inline-end:1px solid var(--border);
  z-index:40;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 14px}
.brand-mark{
  width:44px;height:44px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--primary),#0ea5a3);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 10px 22px -12px rgba(15,118,110,.9);
}
.brand-mark svg{width:24px;height:24px}
.brand-title{font-weight:700;font-size:16px;line-height:1.3}
.brand-sub{font-size:11.5px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.02em;padding:10px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;
  transition:background .15s ease,color .15s ease,transform .15s ease;
}
.nav a svg{width:19px;height:19px;flex:0 0 auto;opacity:.9}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:700}
[data-theme="dark"] .nav a.active{color:var(--primary)}
.nav a.active svg{opacity:1}
.nav a .badge{margin-inline-start:auto;font-size:11px;background:var(--surface-3);color:var(--muted);border-radius:999px;padding:1px 8px;font-weight:700}
.nav a.active .badge{background:#fff6;color:inherit}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.treasury-mini{
  border-radius:16px;padding:14px;
  background:linear-gradient(150deg,var(--primary),#0d9488 60%,#115e59);
  color:#fff;box-shadow:0 16px 34px -22px rgba(13,148,136,.9);
}
.treasury-mini .lbl{font-size:11.5px;opacity:.85;font-weight:600}
.treasury-mini .val{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.treasury-mini .sub{font-size:11px;opacity:.8;margin-top:4px}
.side-link{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:8px 10px;border-radius:10px}
.side-link:hover{background:var(--surface-2);color:var(--text)}
.side-link svg{width:16px;height:16px}

/* ============ Main ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:14px clamp(14px,3vw,28px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--border);
}
.topbar h1{font-size:clamp(17px,2.4vw,22px);font-weight:800;letter-spacing:-.01em;line-height:1.25}
.topbar .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.topbar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.hamburger{display:none}
@media (max-width:1024px){ .hamburger{display:grid} }
.content{padding:clamp(14px,2.6vw,28px);display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%;margin:0 auto}

/* ============ Buttons / inputs ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;
  transition:.15s ease;white-space:nowrap;
}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:transparent;color:#fff;box-shadow:0 10px 22px -14px var(--primary)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent);background:var(--bad-soft)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.icon-btn{
  display:grid;place-items:center;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted-2);font-weight:500}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14px;font-weight:500;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.input::placeholder{color:var(--muted-2);font-weight:400}
textarea.input{resize:vertical;min-height:70px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(0% + 16px) calc(50% + 1px),calc(0% + 21px) calc(50% + 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-start:34px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}

/* ============ Cards ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head h2{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.card-head .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-head .spacer{margin-inline-start:auto}
.card-body{padding:18px}
.card-body.tight{padding:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--kpi-color,var(--primary));opacity:.9}
.kpi-top{display:flex;align-items:flex-start;gap:12px}
.kpi-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--kpi-bg,var(--primary-soft));color:var(--kpi-color,var(--primary));flex:0 0 auto}
.kpi-ico svg{width:20px;height:20px}
.kpi-label{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.4}
.kpi-value{font-size:clamp(21px,2.6vw,26px);font-weight:800;letter-spacing:-.02em;margin-top:6px;display:flex;align-items:baseline;gap:6px}
.kpi-foot{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.primary{background:var(--primary-soft);color:var(--primary-ink)}
[data-theme="dark"] .pill.primary{color:var(--primary)}

/* Grid helpers */
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ============ Table ============ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tbl th{
  text-align:start;font-size:11.5px;font-weight:700;color:var(--muted);
  padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.actions{white-space:nowrap;text-align:end}
.money-pos{color:var(--ok);font-weight:700}
.money-neg{color:var(--bad);font-weight:700}
.money-neutral{font-weight:700}
.who{display:flex;align-items:center;gap:10px;min-width:150px}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--surface-3);color:var(--muted);flex:0 0 auto}
.avatar.lg{width:52px;height:52px;border-radius:16px;font-size:18px}
.who .nm{font-weight:700;font-size:13.5px;line-height:1.35}
.who .ph{font-size:11.5px;color:var(--muted);direction:ltr;text-align:end;font-weight:500}
.tx-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.tx-ico svg{width:17px;height:17px}
.tx-ico.in{background:var(--ok-soft);color:var(--ok)}
.tx-ico.out{background:var(--bad-soft);color:var(--bad)}
.tx-ico.refund{background:var(--warn-soft);color:var(--warn)}

/* status tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.active{background:var(--ok-soft);color:var(--ok)}
.tag.excused{background:var(--info-soft);color:var(--info)}
.tag.suspended{background:var(--bad-soft);color:var(--bad)}

/* segmented attendance control */
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--surface-3);border-radius:12px;border:1px solid var(--border)}
.seg button{
  border:0;background:transparent;padding:6px 9px;border-radius:9px;
  font-size:11.5px;font-weight:700;color:var(--muted);transition:.14s ease;white-space:nowrap;
}
.seg button:hover{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--text)}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(13,27,42,.14)}
.seg button.on[data-s="present"]{color:var(--ok)}
.seg button.on[data-s="late"]{color:var(--warn)}
.seg button.on[data-s="absent"]{color:var(--bad)}
.seg button.on[data-s="excused"]{color:var(--info)}
.seg button.on[data-s=""]{color:var(--muted)}
.seg.vertical{flex-direction:column;width:100%}
@media (max-width:560px){.seg.vertical button{text-align:center}}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--muted-2)}
.empty .ic svg{width:26px;height:26px}
.empty h3{font-size:14.5px;font-weight:800;color:var(--text)}
.empty p{font-size:12.5px;max-width:340px}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(8,17,32,.55);backdrop-filter:blur(4px);z-index:90;display:grid;place-items:center;padding:16px;overflow-y:auto;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .2s ease}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15.5px;font-weight:800}
.modal-head .sub{font-size:12px;color:var(--muted)}
.modal-head .icon-btn{margin-inline-start:auto;border:0;background:var(--surface-2)}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;padding:14px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.modal-foot .spacer{margin-inline-start:auto}

/* toast */
#toast{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.toast svg{width:16px;height:16px}
.toast.ok{background:#0f766e;color:#fff}
.toast.err{background:#b91c1c;color:#fff}

/* misc */
.divider{height:1px;background:var(--border);margin:14px 0}
.stat-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13.5px;border-bottom:1px dashed var(--border)}
.stat-line:last-child{border-bottom:0}
.stat-line .v{font-weight:800}
.legend{display:grid;gap:8px}
.legend-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.legend-item .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend-item b{color:var(--text);margin-inline-start:auto;font-weight:700}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--info-soft);color:var(--info);font-size:12.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--info) 22%,transparent)}
.banner svg{width:18px;height:18px;flex:0 0 auto}
.banner.primary{background:var(--primary-soft);color:var(--primary-ink);border-color:color-mix(in srgb,var(--primary) 25%,transparent)}
[data-theme="dark"] .banner.primary{color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--primary);color:#fff;border-color:transparent}
.hstack{display:flex;align-items:center;gap:8px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.back-link:hover{color:var(--primary)}
.back-link svg{width:15px;height:15px}
.mono{font-variant-numeric:tabular-nums}
code{direction:ltr;unicode-bidi:isolate;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;background:var(--surface-3);color:var(--text);padding:1px 6px;border-radius:6px;display:inline-block}
.nowrap{white-space:nowrap}
.scroll-x{overflow-x:auto;padding-bottom:4px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:700;font-size:13.5px}
.list-item .s{font-size:11.5px;color:var(--muted)}
.amount{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amount.in{color:var(--ok)}
.amount.out{color:var(--bad)}
.amount.refund{color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.stat-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-mini .box{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.stat-mini .box .l{font-size:11.5px;color:var(--muted);font-weight:600}
.stat-mini .box .v{font-size:16px;font-weight:800;margin-top:3px}
.warn-box{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 26%,transparent);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:12.5px;font-weight:600}

.switch{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:40px;height:23px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:.18s}
.switch .track::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.switch input:checked + .track{background:var(--primary);border-color:transparent}
.switch input:checked + .track::after{inset-inline-start:auto;inset-inline-end:2px;background:#fff}
.switch input:checked ~ .sw-label{color:var(--primary)}
@media (max-width:1024px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:280px;transform:translateX(100%);transition:transform .22s ease;box-shadow:var(--shadow-lg);border:0}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(8,17,32,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
}
@media (max-width:760px){
  table.tbl.cards{min-width:0}
  table.tbl.cards thead{display:none}
  table.tbl.cards tbody tr{display:block;padding:12px 14px;border-bottom:1px solid var(--border)}
  table.tbl.cards tbody tr:hover{background:transparent}
  table.tbl.cards tbody td{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border:0;text-align:start !important;flex-wrap:wrap}
  table.tbl.cards tbody td::before{content:attr(data-label);font-size:11.5px;font-weight:800;color:var(--muted);flex:0 0 auto}
  table.tbl.cards tbody td.cell-main{display:block;padding:0 0 8px}
  table.tbl.cards tbody td.cell-main::before{display:none}
  table.tbl.cards tbody td.actions{justify-content:flex-start;gap:8px;margin-top:8px;padding-top:9px;border-top:1px dashed var(--border)}
  table.tbl.cards tbody td.actions::before{display:none}
  table.tbl.cards tbody td.actions .hstack{justify-content:flex-start !important}
  table.tbl.cards tbody td:not([data-label])::before{display:none}
  table.tbl.cards tbody td .small.muted{width:100%}
}
@media (max-width:900px){ .switch .sw-label{display:none} }
@media (max-width:640px){
  .topbar{padding:10px 12px;gap:8px}
  .topbar h1{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .sub{display:none}
  .topbar-actions{gap:6px}
  .icon-btn{width:36px;height:36px}
  .card-head{padding:13px 14px}
  .card-head h2{font-size:14.5px}

}

  .btn span.lbl{display:none}
  .btn{padding:9px 11px}
}
.print-only{display:none}

/* ---------- boot loader / sync badge ---------- */
.boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(8px);transition:opacity .35s ease,visibility .35s ease}
.boot.hide{opacity:0;visibility:hidden;pointer-events:none}
.boot-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 34px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);min-width:250px;text-align:center}
.boot-logo{width:58px;height:58px;object-fit:contain;border-radius:14px}
.boot-title{font-weight:800;font-size:16px;letter-spacing:-.01em}
.boot-text{font-size:12.5px;color:var(--muted);font-weight:600}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .85s linear infinite;margin-top:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-badge{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font:inherit;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.conn-badge:hover{background:var(--surface-2)}
.conn-badge .dotc{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:0 0 auto}
.conn-badge.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent);background:var(--ok-soft)}
.conn-badge.live .dotc{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 24%,transparent);animation:pulse 2.4s ease-in-out infinite}
.conn-badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);background:var(--warn-soft)}
.conn-badge.warn .dotc{background:var(--warn)}
.conn-badge.off{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent);background:var(--bad-soft)}
.conn-badge.off .dotc{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.db-banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;font-size:12.5px;font-weight:600;line-height:1.7;border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);background:var(--warn-soft);color:var(--warn)}
.db-banner.bad{border-color:color-mix(in srgb,var(--bad) 32%,transparent);background:var(--bad-soft);color:var(--bad)}
.db-banner svg{flex:0 0 auto;margin-top:2px}
.db-banner code{background:#0001;color:inherit}
.db-rules{direction:ltr;unicode-bidi:isolate;text-align:left;background:var(--surface-3);color:var(--text);border-radius:12px;padding:12px 14px;font-family:Consolas,monospace;font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre;margin:0}
.conn-badge .lbl-short{display:none}
@media (max-width:900px){
  .conn-badge .lbl{display:none}
  .conn-badge .lbl-short{display:inline}
  .conn-badge{height:36px;padding:0 10px;font-size:11px}
}

@media print{

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getDatabase, ref, onValue, set, update, remove, get, child, goOffline, goOnline
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {

  measurementId: "G-R5J8DGGHHM"

const AUTH_CDN = "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

try {
  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  window.FBX = {
    app, db: database,
    databaseURL: firebaseConfig.databaseURL,
    projectId: firebaseConfig.projectId,
    auth: null, authFns: null,
    ref, onValue, set, update, remove, get, child, goOffline, goOnline
  };

  onValue(ref(database, '.info/connected'), (snap) => {
    window.dispatchEvent(new CustomEvent('fb-conn', { detail: snap.val() === true }));

  // قاعدة البيانات جاهزة — لا ننتظر وحدة المصادقة

  (async () => {

      // الجلسة تنتهي بإغلاق المتصفح (يبقى الزائر التالي في وضع القراءة فقط)
      try { await m.setPersistence(auth, m.browserSessionPersistence); } catch (e) { /* ignore */ }
      window.FBX.auth = auth;

        signInWithEmailAndPassword: m.signInWithEmailAndPassword,
        signOut: m.signOut,
        onAuthStateChanged: m.onAuthStateChanged
      };
      m.onAuthStateChanged(auth, (user) => {
        window.dispatchEvent(new CustomEvent('fb-auth', {
          detail: user ? { uid: user.uid, email: user.email || '' } : null
        }));
      });
    } catch (err) {
      window.FB_AUTH_ERROR = err && err.message ? err.message : String(err);
      window.dispatchEvent(new CustomEvent('fb-auth-failed', { detail: window.FB_AUTH_ERROR }));
      window.dispatchEvent(new CustomEvent('fb-auth', { detail: null }));
    }
  })();
} catch (err) {
  window.FB_ERROR = err && err.message ? err.message : String(err);
  window.dispatchEvent(new CustomEvent('fb-failed', { detail: window.FB_ERROR }));
}

/* ---------- Tiny helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => nf.format(round2(n));
const sarHTML = (n) => `${money(n)} <span class="cur">ر.س</span>`;
const pad = (n) => String(n).padStart(2, '0');

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function nowLocal() {
  const d = new Date();
  return `${todayISO()}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function parseDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(v, withDay) {
  const d = parseDate(v);
  if (!d) return '—';
  const base = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return withDay ? `${WEEKDAYS[d.getDay()]}، ${base}` : base;
}
function fmtDateTime(v) {
  const d = parseDate(v);
  if (!d) return '—';
  return `${fmtDate(v)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtShort(v) {
  const d = parseDate(v);
  if (!d) return '—';
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '؟';
  return (parts[0][0] || '') + (parts[1] ? parts[1][0] : '');
}

/* ---------- Firebase helpers ---------- */
function fbApi() { return window.FBX || null; }

function arrFromObj(obj) {
  if (!obj || typeof obj !== 'object') return [];
  return Object.keys(obj).map(key => {
    const v = obj[key] && typeof obj[key] === 'object' ? obj[key] : {};
    return { ...v, id: key };
  });
}
function objFromArr(arr) {
  const out = {};
  (arr || []).forEach(item => {
    if (!item || !item.id) return;
    const { id, ...rest } = item;
    out[id] = rest;
  });
  return out;
}
function withoutId(item) {
  const { id, ...rest } = item || {};
  return rest;
}
function dbToState(val) {
  const v = val && typeof val === 'object' ? val : {};
  return normalize({
    members: arrFromObj(v.members),
    sessions: arrFromObj(v.sessions),
    attendance: v.attendance && typeof v.attendance === 'object' ? v.attendance : {},
    txns: arrFromObj(v.transactions),
    expenses: arrFromObj(v.expenses),
    settings: v.settings && typeof v.settings === 'object' ? v.settings : {}
  });
}
function stateToDb(s) {
  return {
    members: objFromArr(s.members),
    sessions: objFromArr(s.sessions),
    attendance: s.attendance || {},
    transactions: objFromArr(s.txns),
    expenses: objFromArr(s.expenses),
    settings: s.settings || {}
  };
}

/* كل عمليات الكتابة تمر من هنا — مع معالجة أخطاء الصلاحيات */
function dbOp(op, path, value) {
  const api = fbApi();
  if (!api) {
    toast('لا يوجد اتصال بقاعدة البيانات — لن يُحفظ التغيير', 'err');
    return Promise.resolve(null);
  }
  const target = api.ref(api.db, path);
  let p;
  try {
    if (op === 'set') p = api.set(target, value);
    else if (op === 'update') p = api.update(target, value);
    else p = api.remove(target);
  } catch (err) {
    handleDbError(err);
    return Promise.resolve(null);
  }
  return p.then(() => {
    lastSync = new Date().toISOString();
    return true;
  }).catch(err => {
    handleDbError(err);
    return null;
  });
}
const dbSet = (path, value) => dbOp('set', path, value);
const dbUpdate = (path, value) => dbOp('update', path, value);
const dbRemove = (path) => dbOp('remove', path);

function handleDbError(err) {
  const msg = (err && (err.message || err.code)) ? String(err.message || err.code) : String(err);
  console.error('[Firebase]', err);
  if (/permission|denied/i.test(msg)) {
    dbStatus = 'error';
    dbError = 'PERMISSION_DENIED';
  } else {
    dbError = msg;
    if (dbStatus !== 'offline') dbStatus = 'error';
  }
  updateConnBadge();
  render();
}

/* ---------- الاتصال والمزامنة ---------- */
function startFirebase() {
  if (window.FBX) { attachDbListeners(); return; }
  window.addEventListener('fb-ready', () => attachDbListeners(), { once: true });
  window.addEventListener('fb-failed', (e) => enterOfflineMode(e.detail), { once: true });
  // مهلة قصوى: إن لم تُحمّل المكتبة (بدون إنترنت) ننتقل لوضع المعاينة
  let tries = 0;
  const timer = setInterval(() => {
    if (window.FBX) { clearInterval(timer); return; }
    if (++tries >= 24) {
      clearInterval(timer);
      if (!window.FBX) enterOfflineMode(window.FB_ERROR || 'تعذر الوصول إلى Firebase');
    }
  }, 250);
}

let dbListenersAttached = false;
function attachDbListeners() {
  if (dbListenersAttached) return;
  const api = fbApi();
  if (!api) { enterOfflineMode(); return; }
  dbListenersAttached = true;

  window.addEventListener('fb-conn', (e) => {
    const online = !!e.detail;
    if (online) {
      if (dbStatus !== 'error') dbStatus = 'live';
      dbError = '';
    } else if (dbStatus !== 'error') {
      dbStatus = 'offline';
    }
    updateConnBadge();
    const banner = document.querySelector('.db-banner');
    if (banner) render();
  });

  api.onValue(api.ref(api.db, '/'), (snap) => {
    const val = snap.val();
    const next = dbToState(val);
    dbStatus = 'live';
    dbError = '';
    booted = true;
    hideBoot();

    const hash = JSON.stringify(next);
    if (hash !== lastSnapshotHash) {
      lastSnapshotHash = hash;
      state = next;
      render();
    }
    updateConnBadge();
    maybeSeedSettings(val);
  }, (err) => {
    booted = true;
    hideBoot();
    handleDbError(err);
    console.error('[Firebase] قراءة البيانات فشلت', err);
  });
}

function maybeSeedSettings(val) {
  if (!fbApi() || !adminUser) return;   // الزائر لا يملك صلاحية الكتابة
  if (val && val.settings) return;
  // تهيئة أولية: كتابة الإعدادات الافتراضية مرة واحدة (اسم المجموعة + الرسوم)
  dbSet(DB_PATHS.settings, { ...DEFAULTS, logo: '' });

function enterOfflineMode(reason) {
  previewMode = true;
  dbStatus = 'offline';

function normalize(s) {
  const base = blankState();
  if (!s || typeof s !== 'object') return base;
  return {
    members: Array.isArray(s.members) ? s.members.map(m => ({
      id: m.id || uid('mem'),
      name: String(m.name || 'بدون اسم'),
      status: MEMBER_STATUS[m.status] ? m.status : 'active',
      note: String(m.note || ''),
      joinedAt: m.joinedAt || todayISO()
    })) : [],
    sessions: Array.isArray(s.sessions) ? s.sessions.map(x => ({
      id: x.id || uid('ses'),
      title: String(x.title || 'جلسة'),
      date: x.date || todayISO(),
      note: String(x.note || '')
    })) : [],
    attendance: (s.attendance && typeof s.attendance === 'object') ? s.attendance : {},
    txns: Array.isArray(s.txns) ? s.txns.map(t => ({
      id: t.id || uid('txn'),
      memberId: t.memberId || '',
      type: TXN_TYPES[t.type] ? t.type : 'payment',
      amount: round2(t.amount),
      datetime: t.datetime || nowLocal(),
      note: String(t.note || ''),
      method: String(t.method || '')
    })) : [],
    expenses: Array.isArray(s.expenses) ? s.expenses.map(e => ({
      id: e.id || uid('exp'),
      description: String(e.description || 'مصروف'),
      category: EXPENSE_CATS.includes(e.category) ? e.category : 'أخرى',
      amount: round2(e.amount),
      date: e.date || todayISO(),
      note: String(e.note || '')
    })) : [],
    settings: { ...DEFAULTS, ...(s.settings || {}) }
  };
}


/* ---------- Computation ---------- */
function statusFee(status) {
  const s = state.settings;
  if (status === 'late') return round2(s.lateFee);
  if (status === 'absent') return round2(s.absentFee);
  if (status === 'present') return round2(s.presentFee || 0);
  if (status === 'excused') return round2(s.excusedFee || 0);
  return 0;
}
function attOf(sessionId, memberId) {
  const row = state.attendance[sessionId];
  return row ? row[memberId] || null : null;
}
function memberAttendance(memberId) {
  return state.sessions
    .map(ses => ({ ses, status: attOf(ses.id, memberId) }))
    .filter(x => x.status)
    .sort((a, b) => new Date(b.ses.date) - new Date(a.ses.date));
}
function memberTxns(memberId) {
  return state.txns
    .filter(t => t.memberId === memberId)
    .sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
}
function memberTotals(memberId) {
  let fees = 0, present = 0, late = 0, absent = 0, excused = 0, marked = 0;
  Object.keys(state.attendance).forEach(sid => {
    const st = attOf(sid, memberId);
    if (!st) return;
    marked++;
    fees += statusFee(st);
    if (st === 'present') present++;
    else if (st === 'late') late++;
    else if (st === 'absent') absent++;
    else if (st === 'excused') excused++;
  });
  let paid = 0, refunded = 0;
  state.txns.forEach(t => {
    if (t.memberId !== memberId) return;
    if (t.type === 'refund') refunded += round2(t.amount);
    else paid += round2(t.amount);
  });
  const net = round2(paid - refunded);
  return {
    fees: round2(fees), paid: round2(paid), refunded: round2(refunded),
    net, balance: round2(fees - net),
    sessions: marked, present, late, absent, excused
  };
}
function computeTotals() {
  let totalPaid = 0, totalRefund = 0;
  state.txns.forEach(t => {
    const a = round2(t.amount);
    if (t.type === 'refund') totalRefund += a; else totalPaid += a;
  });
  const totalExpenses = round2(state.expenses.reduce((s, e) => s + round2(e.amount), 0));
  const treasury = round2(totalPaid - totalExpenses - totalRefund);
  let overdue = 0, surplus = 0, fees = 0;
  state.members.forEach(m => {
    const t = memberTotals(m.id);
    fees += t.fees;
    if (t.balance > 0) overdue += t.balance;
    else if (t.balance < 0) surplus += -t.balance;
  });
  return {
    totalPaid: round2(totalPaid),
    totalRefund: round2(totalRefund),
    totalExpenses,
    treasury,
    overdue: round2(overdue),
    surplus: round2(surplus),
    fees: round2(fees),
    activeCount: state.members.filter(m => m.status === 'active').length,
    membersCount: state.members.length,
    sessionsCount: state.sessions.length,
    txnCount: state.txns.length
  };
}
function activityFeed() {
  const items = [];
  state.txns.forEach(t => items.push({
    kind: t.type, ref: 'txn', id: t.id, memberId: t.memberId,
    date: t.datetime, title: memberName(t.memberId), amount: round2(t.amount),
    note: t.note, method: t.method
  }));
  state.expenses.forEach(e => items.push({
    kind: 'expense', ref: 'exp', id: e.id, date: e.date,
    title: e.description, amount: round2(e.amount), note: e.note, category: e.category
  }));
  items.sort((a, b) => (parseDate(b.date)?.getTime() || 0) - (parseDate(a.date)?.getTime() || 0));
  return items;
}
function memberName(id) {
  const m = state.members.find(x => x.id === id);
  return m ? m.name : 'عضو محذوف';
}
function memberById(id) { return state.members.find(x => x.id === id) || null; }
function attendanceSummary(sessionId) {
  const row = state.attendance[sessionId] || {};
  let fees = 0, counts = { present: 0, late: 0, absent: 0, excused: 0, unmarked: 0 };
  state.members.forEach(m => {
    const st = row[m.id];
    if (st) { counts[st] = (counts[st] || 0) + 1; fees += statusFee(st); }
    else counts.unmarked++;
  });
  return { fees: round2(fees), counts };
}
function balanceTone(b) { return b > 0 ? 'neg' : b < 0 ? 'pos' : 'neutral'; }
function STATUS_LABEL(status) { return (MEMBER_STATUS[status] || MEMBER_STATUS.active).label; }

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'err' ? 'err' : 'ok');
  el.innerHTML = icon(type === 'err' ? 'alert' : 'checkCircle') + `<span>${esc(msg)}</span>`;
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; }, 2200);
  setTimeout(() => el.remove(), 2600);
}

function authApi() {
  return (window.FBX && window.FBX.auth && window.FBX.authFns) ? window.FBX.authFns : null;
}

function authErrorMessage(err) {
  const code = (err && (err.code || err.message)) ? String(err.code || err.message) : '';
  if (/invalid-email/.test(code)) return 'صيغة البريد الإلكتروني غير صحيحة.';
  if (/user-not-found|wrong-password|invalid-credential|INVALID_LOGIN_CREDENTIALS|invalid-login/.test(code)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if (/too-many-requests/.test(code)) return 'محاولات دخول كثيرة — انتظر قليلاً ثم حاول مجدداً.';
  if (/user-disabled/.test(code)) return 'هذا الحساب معطّل في Firebase.';
  if (/operation-not-allowed/.test(code)) return 'تسجيل الدخول بالبريد وكلمة المرور غير مُفعّل في Firebase Console.';
  if (/network-request-failed|offline/.test(code)) return 'تعذر الاتصال بالشبكة — تحقق من الإنترنت.';
  if (/unauthorized-domain/.test(code)) return 'هذا النطاق غير مصرّح به في Firebase (Authorized domains).';
  if (/api-key-not-valid|invalid-api-key/.test(code)) return 'إعداد Firebase غير صحيح (API key).';
  return 'تعذر تسجيل الدخول: ' + (err && err.message ? err.message : 'خطأ غير معروف');
}

function viewMemberDetail() {

/* ---------- Attendance ---------- */
let currentSessionId = null;
function ensureSession() {
  if (!state.sessions.length) return null;
  const list = state.sessions.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!list.some(s => s.id === currentSessionId)) currentSessionId = list[0].id;
  return currentSessionId;
}
function viewAttendance() {
  const sid = ensureSession();
  const sessionsSorted = state.sessions.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const ses = state.sessions.find(s => s.id === sid);
  const sum = ses ? attendanceSummary(ses.id) : null;

  return `
  <section class="card">
    <div class="card-head">
      <div><h2>الجلسات الأسبوعية</h2><div class="sub">${state.sessions.length} جلسة مسجلة · رسوم الجلسة ${money(state.settings.sessionFee)} ر.س</div></div>

      <div class="row no-print">
        ${locked ? '' : `<button class="btn btn-primary" data-act="add-session">${icon('plus')} جلسة جديدة</button>`}
      </div>
    </div>
    <div class="card-body" style="padding-bottom:12px">
      ${sessionsSorted.length ? `<div class="scroll-x"><div class="chips" style="flex-wrap:nowrap">
        ${sessionsSorted.map(s => {
          const c = attendanceSummary(s.id);
          return `<button class="chip ${s.id === sid ? 'on' : ''}" data-act="pick-session" data-id="${s.id}" style="white-space:nowrap">
            ${esc(s.title)} · ${fmtShort(s.date)} <span class="num" style="opacity:.7">(${Object.values(c.counts).slice(0, 4).reduce((a, b) => a + b, 0)} مسجل)</span>
          </button>`;
        }).join('')}
      </div></div>` : ''}
    </div>
  </section>

  ${!ses ? emptyState('calendar', 'لا توجد جلسات بعد', 'أنشئ جلسة أسبوعية ثم سجّل حضور الأعضاء فيها لاحتساب الرسوم تلقائياً.',
    locked ? '' : `<button class="btn btn-primary" data-act="add-session" style="margin-top:8px">${icon('plus')} إنشاء جلسة</button>`) : `
  <section class="card">
    <div class="card-head">
      <div>
        <h2>${esc(ses.title)}</h2>
        <div class="sub">${fmtDate(ses.date, true)}${ses.note ? ' · ' + esc(ses.note) : ''}</div>
      </div>
      <div class="spacer"></div>
      <div class="row no-print">
        ${locked ? '' : `<button class="btn btn-sm" data-act="all-present" data-id="${ses.id}">${icon('checkCircle')} الكل حاضر</button>
        <button class="btn btn-sm" data-act="edit-session" data-id="${ses.id}">${icon('edit')} تعديل</button>
        <button class="btn btn-sm btn-danger" data-act="del-session" data-id="${ses.id}">${icon('trash')} حذف</button>`}
      </div>
    </div>
    <div class="card-body">
      <div class="stat-mini" style="margin-bottom:16px">
        <div class="box"><div class="l">حاضر</div><div class="v" style="color:var(--ok)">${sum.counts.present || 0}</div></div>
        <div class="box"><div class="l">تأخير</div><div class="v" style="color:var(--warn)">${sum.counts.late || 0}</div></div>
        <div class="box"><div class="l">غياب بدون عذر</div><div class="v" style="color:var(--bad)">${sum.counts.absent || 0}</div></div>

      ${state.members.length ? `<div class="list" style="border:1px solid var(--border);border-radius:14px;overflow:hidden">

      : emptyState('users', 'لا يوجد أعضاء', 'أضف أعضاء أولاً لتسجيل حضورهم.')}
    </div>
  </section>`}`;
}

/* ---------- Expenses ---------- */

  const total = list.reduce((s, e) => s + round2(e.amount), 0);
  const byCat = EXPENSE_CATS.map(c => ({ c, v: list.filter(e => e.category === c).reduce((s, e) => s + round2(e.amount), 0) })).filter(x => x.v > 0);
  const maxCat = Math.max(1, ...byCat.map(x => x.v));

  return `
  <section class="kpis">
    ${kpiCard({ label: 'إجمالي المصروفات', iconName: 'bag', color: 'var(--warn)', value: money(total), foot: `<span class="pill warn">${list.length} بند</span><span>تُخصم من الخزينة</span>` })}
    ${kpiCard({ label: 'أعلى بند مصروف', iconName: 'chart', color: 'var(--bad)', value: money(Math.max(0, ...list.map(e => round2(e.amount)))), foot: `<span>${list.length ? esc(list.slice().sort((a, b) => b.amount - a.amount)[0].description) : 'لا يوجد'}</span>` })}
    ${kpiCard({ label: 'متوسط المصروف', iconName: 'chart', color: 'var(--accent)', value: money(list.length ? total / list.length : 0), foot: `<span>لكل بند مصروف</span>` })}
  </section>

  <div class="grid-2">
    <section class="card">

          ${lastSync ? `<div class="stat-line"><span>آخر مزامنة</span><span class="v small" dir="ltr">${fmtDateTime(lastSync)}</span></div>` : ''}
          <div class="banner primary" style="margin-top:12px">${icon('info')} أي إضافة أو تعديل في وضع المشرف تظهر فوراً للزوار على كل الأجهزة بدون تحديث الصفحة.</div>
          <div class="row" style="margin-top:12px">
            <button class="btn btn-sm" data-act="conn-info">${icon('info')} تفاصيل الاتصال</button>
            <button class="btn btn-sm" data-act="reconnect">${icon('refresh')} إعادة الاتصال</button>
          </div>
        </div>
      </section>
    </div>
  </div>`;
}

/* =========================================================

   ========================================================= */
function openModal(html, wide = false) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="backdrop" data-backdrop><div class="modal ${wide ? 'wide' : ''}">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  const f = root.querySelector('input:not([type=hidden]),select,textarea');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 60);
}
function closeModal() {
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
function modalHead(title, sub) {
  return `<div class="modal-head">
    <div><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <button class="icon-btn" type="button" data-close aria-label="إغلاق">${icon('x')}</button>
  </div>`;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function handleAct(act, el) {
  switch (act) {
    case 'admin-login':
      openAdminLoginModal();
      break;
    case 'admin-lock':
    case 'admin-logout':
      signOutAdmin();
      break;
    case 'nav':
      go(el.dataset.view || 'dashboard');
      break;
    case 'open-member':
      go('member', el.dataset.id);
      break;
    case 'toggle-nav':
      $('#sidebar').classList.contains('open') ? closeNav() : openNav();
      break;
    case 'toggle-theme':
      toggleTheme();
      break;
    case 'quick-add':
      if (locked) { toast('وضع القراءة فقط مُفعَّل — أوقفه للتعديل', 'err'); break; }
      openQuickAdd();
      break;
    case 'add-member':
      closeModal(); openMemberForm();
      break;
    case 'edit-member':
      closeModal(); openMemberForm(el.dataset.id);
      break;
    case 'del-member':
      askDeleteMember(el.dataset.id);
      break;
    case 'add-session':
      closeModal(); openSessionForm();
      break;
    case 'edit-session':
      openSessionForm(el.dataset.id);
      break;
    case 'del-session':
      askDeleteSession(el.dataset.id);
      break;
    case 'pick-session':
      currentSessionId = el.dataset.id; render();
      break;
    case 'att':
      markAttendance(el.dataset.session, el.dataset.member, el.dataset.status);
      break;
    case 'all-present':
      markAllPresent(el.dataset.id);
      break;
    case 'add-txn':
      closeModal(); openTxnForm(el.dataset.id || '', el.dataset.type || 'payment');
      break;
    case 'del-txn':
      askDeleteTxn(el.dataset.id);
      break;
    case 'del-expense':
      askDeleteExpense(el.dataset.id);
      break;
    case 'add-expense':
      closeModal();
      if (guarded()) break;
      go('expenses');
      setTimeout(() => $('#eDesc')?.focus({ preventScroll: false }), 80);
      break;
    case 'filter-members':
      $$('#statusFilter .chip').forEach(c => c.classList.toggle('on', c === el));
      applyMemberFilter();
      break;
    case 'filter-txn':
      $$('#txnFilter .chip').forEach(c => c.classList.toggle('on', c === el));
      applyTxnFilter();
      break;
    case 'export-excel': exportExcel(); break;
    case 'export-members': exportMembers(); break;
    case 'export-txns': exportTxns(); break;
    case 'export-expenses': exportExpenses(); break;
    case 'export-attendance': exportAttendance(); break;
    case 'print': setTimeout(() => window.print(), 120); break;
    case 'backup': backupJSON(); break;
    case 'restore': $('#importFile')?.click(); break;
    case 'conn-info': openConnInfo(); break;
    case 'reconnect': reconnectDb(); break;
    case 'reset': askReset(); break;
    default: break;
  }
}

function markAttendance(sessionId, memberId, status) {
  if (guarded()) return;
  if (!state.attendance[sessionId]) state.attendance[sessionId] = {};
  const row = state.attendance[sessionId];
  const clearing = row[memberId] === status;
  if (clearing) delete row[memberId];
  else row[memberId] = status;
  if (!Object.keys(row).length) delete state.attendance[sessionId];
  render();
  const path = `${DB_PATHS.attendance}/${sessionId}/${memberId}`;
  if (clearing) dbRemove(path); else dbSet(path, status);
}
function markAllPresent(sessionId) {
  if (guarded()) return;
  state.attendance[sessionId] = state.attendance[sessionId] || {};
  const updates = {};
  state.members.filter(m => m.status === 'active').forEach(m => {
    state.attendance[sessionId][m.id] = 'present';
    updates[`${DB_PATHS.attendance}/${sessionId}/${m.id}`] = 'present';
  });
  render();
  if (Object.keys(updates).length) dbUpdate('/', updates);
  toast('تم تسجيل الحضور لجميع الأعضاء النشطين');
}
function askDeleteMember(id) {
  if (guarded()) return;
  const m = memberById(id);
  if (!m) return;
  confirmDialog('حذف العضو', `سيتم حذف «${esc(m.name)}» مع جميع سجلات حضوره وحركاته المالية. لا يمكن التراجع عن هذا الإجراء.`, () => {
    const updates = { [`${DB_PATHS.members}/${id}`]: null };
    Object.keys(state.attendance).forEach(sid => { updates[`${DB_PATHS.attendance}/${sid}/${id}`] = null; });
    state.txns.filter(t => t.memberId === id).forEach(t => { updates[`${DB_PATHS.txns}/${t.id}`] = null; });
    state.members = state.members.filter(x => x.id !== id);
    Object.keys(state.attendance).forEach(sid => {
      if (state.attendance[sid]) delete state.attendance[sid][id];
      if (state.attendance[sid] && !Object.keys(state.attendance[sid]).length) delete state.attendance[sid];
    });
    state.txns = state.txns.filter(t => t.memberId !== id);
    if (route.view === 'member' && route.id === id) { route.view = 'members'; route.id = null; }
    render();
    dbUpdate('/', updates).then(() => toast('تم حذف العضو وجميع سجلاته'));
  });
}
function askDeleteSession(id) {
  if (guarded()) return;
  const s = state.sessions.find(x => x.id === id);
  if (!s) return;
  confirmDialog('حذف الجلسة', `سيتم حذف «${esc(s.title)}» وكل سجلات الحضور المرتبطة بها.`, () => {
    state.sessions = state.sessions.filter(x => x.id !== id);
    delete state.attendance[id];
    if (currentSessionId === id) currentSessionId = null;
    render();
    dbUpdate('/', { [`${DB_PATHS.sessions}/${id}`]: null, [`${DB_PATHS.attendance}/${id}`]: null })
      .then(() => toast('تم حذف الجلسة'));
  });
}
function askDeleteTxn(id) {
  if (guarded()) return;
  const t = state.txns.find(x => x.id === id);
  if (!t) return;
  confirmDialog('حذف الحركة المالية', `سيتم حذف ${TXN_TYPES[t.type].label} بمبلغ ${money(t.amount)} ر.س للعضو «${esc(memberName(t.memberId))}».`, () => {
    state.txns = state.txns.filter(x => x.id !== id);
    render();
    dbRemove(`${DB_PATHS.txns}/${id}`).then(() => toast('تم حذف الحركة'));
  });
}
function askDeleteExpense(id) {
  if (guarded()) return;
  const e = state.expenses.find(x => x.id === id);
  if (!e) return;
  confirmDialog('حذف المصروف', `سيتم حذف «${esc(e.description)}» بمبلغ ${money(e.amount)} ر.س وإعادته إلى رصيد الخزينة.`, () => {
    state.expenses = state.expenses.filter(x => x.id !== id);
    render();
    dbRemove(`${DB_PATHS.expenses}/${id}`).then(() => toast('تم حذف المصروف'));
  });
}
function askReset() {
  if (guarded()) return;
  confirmDialog('حذف جميع البيانات', 'سيتم حذف جميع الأعضاء والجلسات والحركات والمصروفات نهائياً من قاعدة البيانات المشتركة، وسيختفي ذلك فوراً عند جميع المستخدمين. (تبقى الإعدادات والشعار ورمز المشرف)', () => {
    const keepSettings = { ...state.settings };
    state = blankState();
    state.settings = keepSettings;
    currentSessionId = null;
    route.view = 'dashboard'; route.id = null;
    render();
    dbUpdate('/', {
      [DB_PATHS.members]: null,
      [DB_PATHS.sessions]: null,
      [DB_PATHS.attendance]: null,
      [DB_PATHS.txns]: null,
      [DB_PATHS.expenses]: null
    }).then(() => toast('تم حذف جميع البيانات من قاعدة البيانات'));
  }, 'حذف نهائي');
}

/* filters */
function applyMemberFilter() {
  const q = ($('#memberSearch')?.value || '').trim().toLowerCase();
  const st = $('#statusFilter .chip.on')?.dataset.status || 'all';
  let shown = 0;
  $$('#membersTable tbody tr').forEach(tr => {
    const nameOk = !q || (tr.dataset.name || '').toLowerCase().includes(q);
    const okS = st === 'all' || tr.dataset.status === st;
    const show = nameOk && okS;
    tr.style.display = show ? '' : 'none';
    if (show) shown++;
  });
  const table = $('#membersTable');
  if (table) table.style.display = shown ? '' : 'none';
  let noRes = $('#membersNoResult');
  if (shown === 0 && table) {
    if (!noRes) {
      noRes = document.createElement('div');
      noRes.id = 'membersNoResult';
      noRes.className = 'empty';
      noRes.innerHTML = `<div class="ic">${icon('search')}</div><h3>لا نتائج مطابقة</h3><p>جرّب تعديل كلمة البحث أو فلتر الحالة.</p>`;
      table.parentElement.parentElement.appendChild(noRes);
    }
    noRes.style.display = '';
  } else if (noRes) noRes.style.display = 'none';
}
function applyTxnFilter() {
  const type = $('#txnFilter .chip.on')?.dataset.type || 'all';
  $$('#txnTable tbody tr').forEach(tr => {
    tr.style.display = (type === 'all' || tr.dataset.type === type) ? '' : 'none';
  });
}

/* =========================================================
   FORMS
   ========================================================= */
function onSubmit(e) {
  const form = e.target.closest('form');
  if (!form) return;

  if (form.id === 'adminLoginForm') {
    e.preventDefault();
    const email = ($('#adminEmail')?.value || '').trim();
    const pass = $('#adminPassword')?.value || '';
    const errBox = $('#adminAuthErr');
    const btn = form.querySelector('button[type="submit"]');
    const fail = (msg) => {
      if (errBox) { errBox.textContent = msg; errBox.style.display = 'block'; }
      if (btn) { btn.disabled = false; btn.innerHTML = icon('unlock') + ' تسجيل الدخول'; }
    };
    const fns = authApi();
    if (!fns) { fail(authModuleError || 'خدمة الدخول غير متاحة — تحقق من الاتصال بالإنترنت.'); return; }
    if (!email || !pass) { fail('أدخل البريد الإلكتروني وكلمة المرور.'); return; }
    if (errBox) errBox.style.display = 'none';
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></span> جارٍ التحقق…'; }
    fns.signInWithEmailAndPassword(window.FBX.auth, email, pass)
      .then(() => {
        closeModal();
        toast('تم تسجيل الدخول — وضع المشرف مُفعّل', 'ok');
      })
      .catch((err) => {
        console.warn('[Auth]', err && err.code, err && err.message);
        fail(authErrorMessage(err));
        const p = $('#adminPassword');
        if (p) { p.value = ''; p.focus(); }
      });
    return;
  }

  if (!form.dataset.form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  const kind = form.dataset.form;

  if (kind === 'member') {
    const name = String(data.name || '').trim();
    if (!name) { toast('يرجى إدخال اسم العضو', 'err'); return; }
    if (form.dataset.id) {
      const m = memberById(form.dataset.id);
      if (!m) return;
      Object.assign(m, { name, status: data.status, note: String(data.note || '').trim() });
      closeModal(); render();
      dbUpdate(`${DB_PATHS.members}/${m.id}`, { name: m.name, status: m.status, note: m.note })
        .then(() => toast('تم تحديث بيانات العضو'));
    } else {
      const m = {
        id: uid('mem'), name,
        status: MEMBER_STATUS[data.status] ? data.status : 'active',
        note: String(data.note || '').trim(), joinedAt: todayISO()
      };
      state.members.push(m);
      closeModal(); render();
      dbSet(`${DB_PATHS.members}/${m.id}`, withoutId(m))
        .then(() => toast('تمت إضافة العضو بنجاح'));
    }
    return;
  }

  if (kind === 'session') {
    const title = String(data.title || '').trim() || 'جلسة';
    const date = data.date || todayISO();
    if (form.dataset.id) {
      const s = state.sessions.find(x => x.id === form.dataset.id);
      if (s) {
        Object.assign(s, { title, date, note: String(data.note || '').trim() });
        dbUpdate(`${DB_PATHS.sessions}/${s.id}`, { title: s.title, date: s.date, note: s.note });
      }
      closeModal(); render(); toast('تم تحديث الجلسة');
    } else {
      const s = { id: uid('ses'), title, date, note: String(data.note || '').trim() };
      state.sessions.push(s);
      currentSessionId = s.id;
      closeModal(); render(); toast('تم إنشاء الجلسة — سجّل الحضور الآن');
      dbSet(`${DB_PATHS.sessions}/${s.id}`, withoutId(s));
      go('attendance');
    }
    return;
  }

  if (kind === 'expense') {
    const amount = round2(data.amount);
    if (!(amount > 0)) { toast('أدخل مبلغاً صحيحاً', 'err'); return; }
    const expense = {
      id: uid('exp'), description: String(data.description || '').trim() || 'مصروف',
      category: data.category || 'أخرى', amount, date: data.date || todayISO(), note: ''
    };
    state.expenses.push(expense);
    render();
    dbSet(`${DB_PATHS.expenses}/${expense.id}`, withoutId(expense))
      .then(() => toast('تم تسجيل المصروف وخصمه من الخزينة'));
    return;
  }

  if (kind === 'txn') {
    const memberId = data.memberId;
    if (!memberById(memberId)) { toast('اختر عضواً صحيحاً', 'err'); return; }
    const amount = round2(data.amount);
    if (!(amount > 0)) { toast('أدخل مبلغاً أكبر من صفر', 'err'); return; }
    const type = TXN_TYPES[data.type] ? data.type : 'payment';
    const payload = {
      id: uid('txn'), memberId, type, amount,
      datetime: data.datetime || nowLocal(),
      note: String(data.note || '').trim()
    };
    if (type === 'refund') {
      const t = memberTotals(memberId);
      const credit = t.net;
      if (amount > credit) {
        confirmDialog('تنبيه: مبلغ استرداد كبير',
          `المبلغ المدفوع الصافي لهذا العضو ${money(credit)} ر.س فقط، والمطلوب استرداد ${money(amount)} ر.س. هل تريد المتابعة؟`,
          () => commitTxn(payload), 'متابعة على أي حال');
        return;
      }
    }
    commitTxn(payload);
    return;
  }

  if (kind === 'settings') {
    if (locked) { toast('وضع القراءة فقط مُفعَّل', 'err'); return; }
    state.settings.groupName = String(data.groupName || '').trim() || DEFAULTS.groupName;
    state.settings.monthlyBase = round2(data.monthlyBase);
    state.settings.sessionFee = round2(data.sessionFee);
    state.settings.lateFee = round2(data.lateFee);
    state.settings.absentFee = round2(data.absentFee);
    render();
    dbUpdate(DB_PATHS.settings, {
      groupName: state.settings.groupName,
      monthlyBase: state.settings.monthlyBase,
      sessionFee: state.settings.sessionFee,
      lateFee: state.settings.lateFee,
      absentFee: state.settings.absentFee
    }).then(() => toast('تم حفظ الإعدادات — ظهرت الآن لجميع المستخدمين'));
    return;
  }
}
function commitTxn(payload) {
  state.txns.push(payload);
  closeModal();
  render();
  dbSet(`${DB_PATHS.txns}/${payload.id}`, withoutId(payload)).then(ok => {
    if (ok) toast(payload.type === 'refund' ? 'تم تسجيل الاسترداد' : 'تم تسجيل الدفعة');
  });
}

function download(filename, content, mime) {
  try {
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('تم تنزيل الملف: ' + filename);
  } catch (err) {
    console.error(err);
    toast('تعذر إنشاء الملف', 'err');
  }
}
function csvText(rows) {
  const body = rows.map(r => r.map(cell => {
    const s = cell === null || cell === undefined ? '' : String(cell);
    return /[",\r\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
  return '\uFEFF' + body;
}
function stamp() {

}

function xlsSheet(name, rows) {
  const safe = String(name).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31);
  const cols = Math.max(...rows.map(r => r.length), 1);
  const colDefs = Array.from({ length: cols }, () => '<Column ss:AutoFitWidth="0" ss:Width="130"/>').join('');
  const body = rows.map((r, ri) => {
    const cells = r.map(v => {
      const isNum = typeof v === 'number' && isFinite(v);
      const style = ri === 0 ? ' ss:StyleID="hdr"' : '';
      return `<Cell${style}><Data ss:Type="${isNum ? 'Number' : 'String'}">${xmlEsc(v)}</Data></Cell>`;
    }).join('');
    return `<Row${ri === 0 ? ' ss:Height="22"' : ''}>${cells}</Row>`;
  }).join('');
  return `<Worksheet ss:Name="${xmlEsc(safe)}">
    <Table>${colDefs}${body}</Table>
    <WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel">
      <DisplayRightToLeft/>
      <FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane>
    </WorksheetOptions>
  </Worksheet>`;
}
function xmlEsc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
}

function importJSON(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      const data = parsed && parsed.data ? parsed.data : parsed;
      if (!data || !Array.isArray(data.members)) throw new Error('invalid');
      confirmDialog('استعادة نسخة احتياطية', 'سيتم استبدال البيانات الحالية بالبيانات الموجودة في الملف. هل تريد المتابعة؟', () => {
        const restored = normalize(data);
        state = restored;
        currentSessionId = null;
        route.view = 'dashboard'; route.id = null; render();
        dbSet('/', stateToDb(restored)).then(() => toast('تمت استعادة البيانات إلى قاعدة البيانات'));
      }, 'استعادة');
    } catch (err) {
      toast('الملف غير صالح — تأكد من أنه نسخة احتياطية للتطبيق', 'err');
    }
  };
  reader.readAsText(file);
}

        .then(() => toast('تم تحديث شعار المجموعة لجميع المستخدمين', 'ok'));
